<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Streamer Space — Engajamento</title>
  <link rel="stylesheet" href="/overlay.css">
  <script defer src="/goal-widget.js"></script>
  <script defer src="/engagement-overlay.js"></script>
</head>
<body class="engagement-overlay">
  <section class="engagement-card" hidden>
    <h1 id="engagement-title"></h1>
    <p id="engagement-empty" hidden></p>
    <ol id="engagement-ranking" hidden></ol>
  </section>
    <div id="likes-goal-widget" class="likes-goal-widget" hidden>
      <div class="likes-goal-header">
        <div class="likes-goal-title-group">
          <span class="likes-goal-icon">🎯</span>
          <span id="likes-goal-title" class="likes-goal-title">Meta de Curtidas</span>
        </div>
        <span id="likes-goal-badge" class="likes-goal-badge" style="display: none;">Meta Atingida! 🎉</span>
      </div>
      <div class="likes-goal-bar-wrapper">
        <div id="likes-goal-progress" class="likes-goal-progress-bar" style="width: 0%;"></div>
      </div>
      <div class="likes-goal-footer">
        <div class="likes-goal-counts">
          <span id="likes-goal-current" class="likes-goal-current">0</span>
          <span class="likes-goal-separator">/</span>
          <span id="likes-goal-target" class="likes-goal-target">1.000</span>
        </div>
        <span id="likes-goal-percentage" class="likes-goal-pct">0%</span>
      </div>
    </div>
</body>
</html>
